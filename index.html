<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corro — Subscription Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18202a;--muted:#667085;--border:#e2e8f0;--accent:#315c4c;--accent2:#d8a64a;--good:#16794b;--warn:#ad6800;--bad:#b42318;--soft:#eef4f1}
[data-theme=dark]{--bg:#111713;--card:#1a211d;--text:#f4f7f5;--muted:#a7b0aa;--border:#303a34;--accent:#7cc5a7;--accent2:#edc36f;--soft:#222e28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 32px;border-bottom:1px solid var(--border);background:var(--card);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0}.subtitle,.note{color:var(--muted);font-size:12px;margin-top:5px}button,select,input{font:inherit}.btn,.tab,select,input{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px}.btn,.tab{cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}main{max-width:1450px;margin:auto;padding:24px 32px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.controls input{min-width:260px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:13px}.card{padding:17px;min-height:106px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.055em}.value{font-size:25px;font-weight:750;margin-top:8px}.detail{font-size:11px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:15px;margin:0 0 14px}.chart{height:300px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--soft)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.empty{padding:50px;text-align:center;color:var(--muted)}.metric-note{padding:11px 13px;background:var(--soft);border-radius:9px;color:var(--muted);font-size:12px;margin-bottom:16px}@media(max-width:850px){header,main{padding-left:16px;padding-right:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Subscription Performance</h1><div class="subtitle" id="lastUpdated">Loading Shopify and Smartrr data…</div></div><button class="btn" id="themeToggle">Dark mode</button></header>
<main><div class="tabs" id="tabs"></div><div id="content"><div class="empty">Loading…</div></div></main>
<script>
const URLS={orders:"data/orders_report.json",subscriptions:"data/subscriptions_report.json"};
const state={view:"overview",orders:[],subscriptions:[],year:"all",month:"all",text:""};let charts=[];
const views=[['overview','Overview'],['orders','Orders'],['products','Top products'],['customers','Top customers'],['subscriptions','Subscriptions']];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0}, has=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='USD')=>has(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD',maximumFractionDigits:0}).format(Number(v)):'—';
const pct=v=>has(v)?new Intl.NumberFormat('en-US',{style:'percent',maximumFractionDigits:1}).format(Number(v)):'—';
const date=v=>v&&!Number.isNaN(new Date(v))?new Date(v).toLocaleDateString('en-US'):'—';
const yearOf=v=>v&&!Number.isNaN(new Date(v))?String(new Date(v).getFullYear()):'unknown';
const monthOf=v=>v&&!Number.isNaN(new Date(v))?String(new Date(v).getMonth()+1).padStart(2,'0'):'unknown';
function parseItems(row){try{return Array.isArray(row.line_items)?row.line_items:JSON.parse(row.line_items||'[]')}catch{return[]}}
function netSales(r){return has(r.net_sales)?num(r.net_sales):num(r.total_price)}
function orderTotal(r){return has(r.order_total)?num(r.order_total):num(r.total_price)}
function selectedOrders(){return state.orders.filter(r=>(state.year==='all'||yearOf(r.created_at)===state.year)&&(state.month==='all'||monthOf(r.created_at)===state.month)&&(!state.text||JSON.stringify(r).toLowerCase().includes(state.text.toLowerCase())))}
function selectedSubscriptions(){return state.subscriptions.filter(r=>!state.text||JSON.stringify(r).toLowerCase().includes(state.text.toLowerCase()))}
function commonControls(includeSearch=true){const years=[...new Set(state.orders.map(r=>yearOf(r.created_at)).filter(y=>y!=='unknown'))].sort((a,b)=>b-a);return `<div class="controls">${includeSearch?`<input id="search" placeholder="Search customer, order, product or status" value="${esc(state.text)}">`:''}<select id="year"><option value="all">All years</option>${years.map(y=>`<option value="${y}" ${state.year===y?'selected':''}>${y}</option>`).join('')}</select><select id="month"><option value="all">All months</option>${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map((m,i)=>`<option value="${m}" ${state.month===m?'selected':''}>${new Date(2026,i,1).toLocaleString('en-US',{month:'long'})}</option>`).join('')}</select></div>`}
function aggregate(rows){const currency=rows.find(r=>r.currency)?.currency||'USD';const orders=rows.length;const customers=new Set(rows.map(r=>r.customer_email).filter(Boolean)).size;const gross=rows.reduce((s,r)=>s+(has(r.gross_sales)?num(r.gross_sales):orderTotal(r)),0);const discounts=rows.reduce((s,r)=>s+num(r.discounts),0);const returns=rows.reduce((s,r)=>s+num(r.returns),0);const net=rows.reduce((s,r)=>s+netSales(r),0);const costRows=rows.filter(r=>has(r.cogs));const cogs=costRows.reduce((s,r)=>s+num(r.cogs),0);const gp=costRows.length?costRows.reduce((s,r)=>s+num(r.gross_profit),0):null;const gm=gp!==null&&net?gp/net:null;return{currency,orders,customers,gross,discounts,returns,net,cogs,gp,gm,aov:orders?net/orders:0,costCoverage:orders?costRows.length/orders:0}}
function monthly(rows){const map={};rows.forEach(r=>{const d=new Date(r.created_at);if(Number.isNaN(d))return;const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;map[k]??={orders:0,net:0,gp:0,gpKnown:false};map[k].orders++;map[k].net+=netSales(r);if(has(r.gross_profit)){map[k].gp+=num(r.gross_profit);map[k].gpKnown=true}});return Object.entries(map).sort().map(([label,v])=>({label,...v}))}
function productData(rows){const map={};rows.forEach(r=>parseItems(r).forEach(i=>{const key=`${i.product||'Unknown product'}|||${i.variant||''}`;const q=has(i.net_quantity)?num(i.net_quantity):num(i.quantity);const revenue=Math.max(q*num(i.unit_price)-num(i.line_discount),0);map[key]??={product:i.product||'Unknown product',variant:i.variant||'',units:0,revenue:0,cogs:0,costKnown:false,customers:new Set()};map[key].units+=q;map[key].revenue+=revenue;if(has(i.unit_cost)){map[key].cogs+=q*num(i.unit_cost);map[key].costKnown=true}if(r.customer_email)map[key].customers.add(r.customer_email)}));return Object.values(map).map(x=>({...x,customers:x.customers.size,gp:x.costKnown?x.revenue-x.cogs:null,gm:x.costKnown&&x.revenue?(x.revenue-x.cogs)/x.revenue:null})).sort((a,b)=>b.revenue-a.revenue)}
function customerData(rows){const map={};rows.forEach(r=>{const k=r.customer_email||'Unknown customer';map[k]??={customer:k,orders:0,net:0,gp:0,gpKnown:false,last:null};map[k].orders++;map[k].net+=netSales(r);if(has(r.gross_profit)){map[k].gp+=num(r.gross_profit);map[k].gpKnown=true}if(!map[k].last||new Date(r.created_at)>new Date(map[k].last))map[k].last=r.created_at});return Object.values(map).map(x=>({...x,aov:x.orders?x.net/x.orders:0})).sort((a,b)=>b.net-a.net)}
function card(label,value,detail=''){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${detail?`<div class="detail">${detail}</div>`:''}</div>`}
function overview(){const rows=selectedOrders(),a=aggregate(rows),m=monthly(rows),products=productData(rows).slice(0,10),customers=customerData(rows).slice(0,10);return `${commonControls()}<div class="metric-note">All sales metrics come from Shopify. Gross Profit and Gross Margin are displayed only when Shopify variant unit costs are available; missing costs are never replaced with spreadsheet values.</div><div class="cards">${card('Orders',a.orders)}${card('Unique customers',a.customers)}${card('Gross sales',money(a.gross,a.currency))}${card('Net sales',money(a.net,a.currency),'After discounts and returns')}${card('AOV',money(a.aov,a.currency),'Net sales ÷ orders')}${card('Gross profit',money(a.gp,a.currency),`Cost coverage ${pct(a.costCoverage)}`)}${card('Gross margin',pct(a.gm))}</div><div class="grid2"><div class="panel chart"><h2>Net sales by month</h2><canvas id="salesChart"></canvas></div><div class="panel chart"><h2>Orders by month</h2><canvas id="ordersChart"></canvas></div></div><div class="grid2"><div class="panel"><h2>Top 10 products</h2>${rankingTable(products,'product')}</div><div class="panel"><h2>Top 10 customers</h2>${rankingTable(customers,'customer')}</div></div>`}
function rankingTable(rows,type){if(!rows.length)return `<div class="empty">Product line details will appear after the updated ETL runs.</div>`;if(type==='product')return `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Variant</th><th>Units</th><th>Customers</th><th>Net sales</th><th>GM</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.product)}</td><td>${esc(x.variant||'—')}</td><td>${x.units}</td><td>${x.customers}</td><td>${money(x.revenue)}</td><td>${pct(x.gm)}</td></tr>`).join('')}</tbody></table></div>`;return `<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Orders</th><th>Net sales</th><th>AOV</th><th>Last order</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.customer)}</td><td>${x.orders}</td><td>${money(x.net)}</td><td>${money(x.aov)}</td><td>${date(x.last)}</td></tr>`).join('')}</tbody></table></div>`}
function ordersView(){const rows=selectedOrders();return `${commonControls()}<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Gross sales</th><th>Discounts</th><th>Returns</th><th>Net sales</th><th>COGS</th><th>Gross profit</th><th>GM</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.order_name||r.order_id)}</td><td>${esc(r.customer_email||'—')}</td><td>${money(has(r.gross_sales)?r.gross_sales:r.total_price,r.currency)}</td><td>${money(r.discounts,r.currency)}</td><td>${money(r.returns,r.currency)}</td><td>${money(netSales(r),r.currency)}</td><td>${money(r.cogs,r.currency)}</td><td>${money(r.gross_profit,r.currency)}</td><td>${pct(r.gross_margin)}</td><td>${esc(r.financial_status||'—')}</td><td>${date(r.created_at)}</td></tr>`).join('')}</tbody></table></div>`}
function productsView(){const rows=productData(selectedOrders());return `${commonControls()}<div class="cards">${card('Products / variants',rows.length)}${card('Units sold',rows.reduce((s,x)=>s+x.units,0))}${card('Product net sales',money(rows.reduce((s,x)=>s+x.revenue,0)))}</div>${rankingTable(rows,'product')}`}
function customersView(){const rows=customerData(selectedOrders());return `${commonControls()}<div class="cards">${card('Customers',rows.length)}${card('Repeat customers',rows.filter(x=>x.orders>1).length)}${card('Repeat rate',pct(rows.length?rows.filter(x=>x.orders>1).length/rows.length:0))}</div>${rankingTable(rows,'customer')}`}
function subscriptionsView(){const rows=selectedSubscriptions();const statuses={};rows.forEach(r=>{const s=String(r.status||'Unknown').toUpperCase();statuses[s]=(statuses[s]||0)+1});const upcoming=rows.filter(r=>r.next_order_date&&new Date(r.next_order_date)>=new Date()).length;return `<div class="controls"><input id="search" placeholder="Search subscription, customer or plan" value="${esc(state.text)}"></div><div class="cards">${card('Subscription records',rows.length)}${card('Customers',new Set(rows.map(r=>r.customer_email).filter(Boolean)).size)}${card('Upcoming billings',upcoming)}</div><div class="panel chart"><h2>Subscription status mix</h2><canvas id="statusChart"></canvas></div><div class="table-wrap"><table><thead><tr><th>Subscription</th><th>Customer</th><th>Status</th><th>Next order</th><th>Plan</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.subscription_id||'—')}</td><td>${esc(r.customer_email||'—')}</td><td><span class="badge">${esc(r.status||'Unknown')}</span></td><td>${date(r.next_order_date)}</td><td>${esc(r.plan_id||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function drawCharts(){charts.forEach(c=>c.destroy());charts=[];const rows=selectedOrders(),m=monthly(rows);const mk=(id,type,labels,data,label)=>{const el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,{type,data:{labels,datasets:[{label,data,borderWidth:2,borderRadius:5,tension:.25}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}))};mk('salesChart','line',m.map(x=>x.label),m.map(x=>x.net),'Net sales');mk('ordersChart','bar',m.map(x=>x.label),m.map(x=>x.orders),'Orders');const status=document.getElementById('statusChart');if(status){const counts={};selectedSubscriptions().forEach(r=>{const s=String(r.status||'Unknown').toUpperCase();counts[s]=(counts[s]||0)+1});charts.push(new Chart(status,{type:'bar',data:{labels:Object.keys(counts),datasets:[{data:Object.values(counts),borderRadius:5}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}))}}
function bind(){document.getElementById('search')?.addEventListener('input',e=>{state.text=e.target.value;render()});document.getElementById('year')?.addEventListener('change',e=>{state.year=e.target.value;render()});document.getElementById('month')?.addEventListener('change',e=>{state.month=e.target.value;render()})}
function render(){document.getElementById('tabs').innerHTML=views.map(([id,label])=>`<button class="tab ${state.view===id?'active':''}" data-view="${id}">${label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.text='';render()});const content={overview,orders:ordersView,products:productsView,customers:customersView,subscriptions:subscriptionsView}[state.view]();document.getElementById('content').innerHTML=content;bind();drawCharts()}
async function load(){const results=await Promise.all(Object.entries(URLS).map(async([k,u])=>{try{const r=await fetch(`${u}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(r.status);return[k,await r.json()]}catch{return[k,[]]}}));results.forEach(([k,v])=>state[k]=Array.isArray(v)?v:[]);const stamps=[...state.orders,...state.subscriptions].map(r=>new Date(r.report_updated_at)).filter(d=>!Number.isNaN(d));document.getElementById('lastUpdated').textContent=stamps.length?`Last updated ${new Date(Math.max(...stamps)).toLocaleString('en-US')}`:'No report data available';render()}
const theme=document.getElementById('themeToggle');function setTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'Light mode':'Dark mode';localStorage.setItem('corro-theme',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('corro-theme')||'light');load();
</script></body></html>
