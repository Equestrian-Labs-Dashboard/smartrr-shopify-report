<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPay — Subscription Performance</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18202a;--muted:#667085;--border:#dde4ea;--accent:#315c4c;--accent2:#eaf2ee;--good:#16794b;--warn:#ad6800;--bad:#b42318}
[data-theme=dark]{--bg:#101512;--card:#19201c;--text:#f4f7f5;--muted:#a7b0aa;--border:#303a34;--accent:#68b494;--accent2:#223029}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 30px;border-bottom:1px solid var(--border);background:var(--card);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}h1{font-size:22px;margin:0}.subtitle{color:var(--muted);font-size:12px;margin-top:5px}main{max-width:1500px;margin:auto;padding:24px 30px}.btn,.tab,select,input{font:inherit;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px}.btn,.tab{cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.controls input{min-width:280px;flex:1}.note{background:var(--accent2);border:1px solid var(--border);padding:11px 13px;border-radius:10px;color:var(--muted);font-size:12px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:13px}.card{padding:17px;min-height:105px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.055em}.value{font-size:25px;font-weight:750;margin-top:8px}.detail{font-size:11px;color:var(--muted);margin-top:5px}.section-title{font-size:16px;margin:24px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:15px;margin:0 0 14px}.chart-host{height:240px;width:100%}.chart-host svg{width:100%;height:100%}.chart-grid{stroke:var(--border)}.chart-axis{fill:var(--muted);font-size:10px}.chart-bar{fill:var(--accent)}.chart-line{fill:none;stroke:var(--accent);stroke-width:3}.chart-area{fill:var(--accent2)}.chart-dot{fill:var(--accent)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{font-size:10px;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:var(--card)}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--accent2)}.good{color:var(--good);font-weight:700}.warn{color:var(--warn);font-weight:700}.bad{color:var(--bad);font-weight:700}.empty{padding:45px;text-align:center;color:var(--muted)}.audit-row{background:color-mix(in srgb,var(--accent2) 65%,transparent)}@media(max-width:850px){header,main{padding-left:16px;padding-right:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>SmartPay Subscription Performance</h1><div class="subtitle" id="lastUpdated">Loading Shopify and Smartrr data…</div></div><button class="btn" id="themeToggle">Dark mode</button></header>
<main><div class="tabs" id="tabs"></div><div id="content"><div class="empty">Loading…</div></div></main>
<script>
const URLS={orders:'data/orders_report.json',subscriptions:'data/subscriptions_report.json'};
const state={view:'overview',orders:[],subscriptions:[],year:'all',month:'all',text:''};
const views=[['overview','Overview'],['orders','Orders'],['products','Products'],['customers','Customers']];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const has=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='USD')=>has(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD',maximumFractionDigits:2}).format(Number(v)):'—';
const pct=v=>has(v)?new Intl.NumberFormat('en-US',{style:'percent',maximumFractionDigits:1}).format(Number(v)):'—';
const date=v=>v&&!Number.isNaN(new Date(v))?new Date(v).toLocaleDateString('en-US'):'—';
const yearOf=v=>v&&!Number.isNaN(new Date(v))?String(new Date(v).getFullYear()):'unknown';
const monthOf=v=>v&&!Number.isNaN(new Date(v))?String(new Date(v).getMonth()+1).padStart(2,'0'):'unknown';
function parseItems(r){try{return Array.isArray(r.line_items)?r.line_items:JSON.parse(r.line_items||'[]')}catch{return[]}}
function gross(r){return has(r.gross_sales)?num(r.gross_sales):num(r.total_price)}
function net(r){return has(r.net_sales)?num(r.net_sales):num(r.total_price)}
function selectedOrders(){const q=state.text.toLowerCase();return state.orders.filter(r=>(state.year==='all'||yearOf(r.created_at)===state.year)&&(state.month==='all'||monthOf(r.created_at)===state.month)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function ytdYear(){return state.year==='all'?String(Math.max(...state.orders.map(r=>Number(yearOf(r.created_at))).filter(Number.isFinite),new Date().getFullYear())):state.year}
function periodLabel(){if(state.year==='all')return state.month==='all'?'All available data':`All years · ${new Date(2026,Number(state.month)-1,1).toLocaleString('en-US',{month:'long'})}`;return state.month==='all'?`${state.year} year to date`:`${new Date(2026,Number(state.month)-1,1).toLocaleString('en-US',{month:'long'})} ${state.year}`}
function controls(){const years=[...new Set(state.orders.map(r=>yearOf(r.created_at)).filter(y=>y!=='unknown'))].sort((a,b)=>b-a);return `<div class="controls"><input id="search" placeholder="Search customer, order, product or status" value="${esc(state.text)}"><select id="year"><option value="all">All years</option>${years.map(y=>`<option value="${y}" ${state.year===y?'selected':''}>${y}</option>`).join('')}</select><select id="month"><option value="all">All months / YTD</option>${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map((m,i)=>`<option value="${m}" ${state.month===m?'selected':''}>${new Date(2026,i,1).toLocaleString('en-US',{month:'long'})}</option>`).join('')}</select></div>`}
function card(label,value,detail=''){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${detail?`<div class="detail">${detail}</div>`:''}</div>`}
function aggregate(rows){const currency=rows.find(r=>r.currency)?.currency||'USD';const grossSales=rows.reduce((s,r)=>s+gross(r),0),discounts=rows.reduce((s,r)=>s+num(r.discounts),0),returns=rows.reduce((s,r)=>s+num(r.returns),0),netSales=rows.reduce((s,r)=>s+net(r),0);const complete=rows.filter(r=>r.margin_status==='complete'&&has(r.cogs)&&has(r.gross_profit));const coveredNet=complete.reduce((s,r)=>s+net(r),0),cogs=complete.reduce((s,r)=>s+num(r.cogs),0),gp=complete.length?complete.reduce((s,r)=>s+num(r.gross_profit),0):null;return{currency,orders:rows.length,customers:new Set(rows.map(r=>r.customer_email).filter(Boolean)).size,gross:grossSales,discounts,returns,net:netSales,aov:rows.length?netSales/rows.length:0,cogs,gp,gm:gp!==null&&coveredNet?gp/coveredNet:null,costCoverage:rows.length?complete.length/rows.length:0,variance:grossSales-discounts-returns-netSales}}
function subscriptionMetrics(year){const rows=state.subscriptions;const active=rows.filter(r=>String(r.status||'').toLowerCase()==='active');const cancelled=rows.filter(r=>String(r.status||'').toLowerCase()==='cancelled');const ytdCancelled=cancelled.filter(r=>{const d=new Date(r.cancelled_at);return !Number.isNaN(d)&&String(d.getFullYear())===year});const monthlyCancelled=ytdCancelled.filter(r=>state.month==='all'||monthOf(r.cancelled_at)===state.month).length;const upcoming=rows.filter(r=>{const d=new Date(r.next_order_date);return !Number.isNaN(d)&&d>=new Date()}).length;const denominator=active.length+ytdCancelled.length;return{active:active.length,customers:new Set(rows.map(r=>r.customer_email).filter(Boolean)).size,upcoming,cancelled:ytdCancelled.length,monthlyCancelled,churn:denominator?ytdCancelled.length/denominator:null,known:rows.filter(r=>r.status).length}}
function monthly(rows){const map={};rows.forEach(r=>{const d=new Date(r.created_at);if(Number.isNaN(d))return;const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;map[k]??={label:d.toLocaleString('en-US',{month:'short'}),net:0,orders:0};map[k].net+=net(r);map[k].orders++});return Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).map(([,v])=>v)}
function overview(){const rows=selectedOrders(),a=aggregate(rows),s=subscriptionMetrics(ytdYear());return `${controls()}<div class="note"><strong>${periodLabel()}.</strong> Gross Sales comes from Shopify merchandise value before discounts. Net Sales equals Gross Sales minus discounts and merchandise returns. Order Total is not used for margin because it can include shipping and tax.</div><div class="cards">${card('Orders',a.orders)}${card('Unique customers',a.customers)}${card('Gross sales',money(a.gross,a.currency),'Before discounts and returns')}${card('Discounts',money(a.discounts,a.currency),'First and recurring subscription discounts included')}${card('Returns',money(a.returns,a.currency))}${card('Net sales',money(a.net,a.currency),'Gross − discounts − returns')}${card('AOV',money(a.aov,a.currency),'Net sales ÷ orders')}${card('Gross profit',money(a.gp,a.currency),`Complete order cost coverage ${pct(a.costCoverage)}`)}${card('Gross margin',pct(a.gm),'Gross profit ÷ covered Net Sales')}</div><div class="grid2"><div class="panel"><h2>Net sales by month</h2><div id="salesChart" class="chart-host"></div></div><div class="panel"><h2>Orders by month</h2><div id="ordersChart" class="chart-host"></div></div></div><h2 class="section-title">Year-to-Date Subscription Data (${ytdYear()})</h2><div class="note">Only confirmed Smartrr statuses are counted. Unknown statuses are excluded from active and cancelled totals. YTD Churn is a snapshot proxy: YTD cancellations ÷ (currently active + YTD cancellations).</div><div class="cards">${card('Active subscriptions',s.active,`${s.known} records have a confirmed status`)}${card('Subscription customers',s.customers,'Distinct Smartrr customers')}${card('Upcoming billings',s.upcoming,'Future billing dates available')}${card('Cancelled subscriptions',s.cancelled,`Cancelled during ${ytdYear()}`)}${card(state.month==='all'?'YTD churn':'Monthly cancellations',state.month==='all'?pct(s.churn):s.monthlyCancelled,state.month==='all'?'Snapshot proxy':'Selected month')}</div>`}
function productData(rows){const map={};rows.forEach(r=>parseItems(r).forEach(i=>{const key=`${i.product||''}|${i.variant||''}|${i.sku||''}`,q=num(i.net_quantity),rev=has(i.net_sales)?num(i.net_sales):q*num(i.unit_price);map[key]??={product:i.product||'Unknown product',variant:i.variant||'',sku:i.sku||'',orders:new Set(),customers:new Set(),units:0,net:0,cogs:0,covered:true};map[key].orders.add(r.order_id);if(r.customer_email)map[key].customers.add(r.customer_email);map[key].units+=q;map[key].net+=rev;if(has(i.cogs))map[key].cogs+=num(i.cogs);else map[key].covered=false}));return Object.values(map).map(x=>({...x,orders:x.orders.size,customers:x.customers.size,gp:x.covered?x.net-x.cogs:null,gm:x.covered&&x.net?(x.net-x.cogs)/x.net:null})).sort((a,b)=>b.net-a.net)}
function customerData(rows){const map={};rows.forEach(r=>{const k=r.customer_email||'Unknown customer';map[k]??={customer:k,orders:0,net:0,last:null};map[k].orders++;map[k].net+=net(r);if(!map[k].last||new Date(r.created_at)>new Date(map[k].last))map[k].last=r.created_at});return Object.values(map).map(x=>({...x,aov:x.orders?x.net/x.orders:0})).sort((a,b)=>b.net-a.net)}
function auditSamples(rows){const priority=rows.filter(r=>String(r.audit_priority).toLowerCase()==='true'||r.audit_priority===true);const others=rows.filter(r=>!priority.includes(r)).sort((a,b)=>String(a.order_id).localeCompare(String(b.order_id)));return [...priority.slice(0,1),...others.slice(0,Math.max(0,3-priority.slice(0,1).length))].slice(0,3)}
function auditTable(rows){const samples=auditSamples(rows);if(!samples.length)return'';return `<h2 class="section-title">Audit sample (3 orders)</h2><div class="note">Validate these order numbers directly in Shopify. The first priority row is the Horse Health 30 lb or zero-margin case when available; the other rows are deterministic samples.</div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Reason</th><th>Gross</th><th>Discounts</th><th>Returns</th><th>Net</th><th>COGS</th><th>Gross profit</th><th>GM</th><th>Formula check</th></tr></thead><tbody>${samples.map(r=>`<tr class="audit-row"><td>${esc(r.order_name||r.order_id)}</td><td>${esc(r.audit_reason||'Random audit sample')}</td><td>${money(gross(r),r.currency)}</td><td>${money(r.discounts,r.currency)}</td><td>${money(r.returns,r.currency)}</td><td>${money(net(r),r.currency)}</td><td>${money(r.cogs,r.currency)}</td><td>${money(r.gross_profit,r.currency)}</td><td>${pct(r.gross_margin)}</td><td class="${Math.abs(num(r.sales_formula_check))<.01?'good':'bad'}">${money(r.sales_formula_check,r.currency)}</td></tr>`).join('')}</tbody></table></div>`}
function ordersView(){const rows=selectedOrders();return `${controls()}<div class="note">Audit formula: Gross Sales − Discounts − Returns = Net Sales. Formula Check must be $0.00. Use each order number to compare the source values directly with Shopify.</div>${auditTable(rows)}<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Type</th><th>Gross</th><th>Discounts</th><th>Returns</th><th>Net</th><th>Order total</th><th>COGS</th><th>Gross profit</th><th>GM</th><th>Cost coverage</th><th>Formula check</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.order_name||r.order_id)}</td><td>${esc(r.customer_email||'—')}</td><td>${esc(r.subscription_order_type||'subscription')}</td><td>${money(gross(r),r.currency)}</td><td>${money(r.discounts,r.currency)}</td><td>${money(r.returns,r.currency)}</td><td>${money(net(r),r.currency)}</td><td>${money(r.order_total||r.total_price,r.currency)}</td><td>${money(r.cogs,r.currency)}</td><td>${money(r.gross_profit,r.currency)}</td><td>${pct(r.gross_margin)}</td><td>${pct(r.cost_coverage_pct)}</td><td class="${Math.abs(num(r.sales_formula_check))<.01?'good':'bad'}">${money(r.sales_formula_check,r.currency)}</td><td>${esc(r.financial_status||'—')}</td><td>${date(r.created_at)}</td></tr>`).join('')}</tbody></table></div>`}
function productsView(){const selected=selectedOrders(),rows=productData(selected);return `${controls()}<div class="cards">${card('Products / variants',rows.length)}${card('Orders represented',new Set(selected.map(r=>r.order_id)).size)}${card('Units sold',rows.reduce((s,x)=>s+x.units,0))}${card('Product net sales',money(rows.reduce((s,x)=>s+x.net,0)))}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Variant</th><th>SKU</th><th>Orders</th><th>Units</th><th>Customers</th><th>Net sales</th><th>COGS</th><th>Gross profit</th><th>GM</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.product)}</td><td>${esc(x.variant||'—')}</td><td>${esc(x.sku||'—')}</td><td>${x.orders}</td><td>${x.units}</td><td>${x.customers}</td><td>${money(x.net)}</td><td>${money(x.covered?x.cogs:null)}</td><td>${money(x.gp)}</td><td>${pct(x.gm)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Run the ETL for the selected year to load product details.</div>'}`}
function customersView(){const rows=customerData(selectedOrders()),repeat=rows.filter(x=>x.orders>1).length;return `${controls()}<div class="cards">${card('Customers',rows.length)}${card('Repeat customers',repeat)}${card('Repeat rate',pct(rows.length?repeat/rows.length:0))}</div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Orders</th><th>Total purchased</th><th>AOV</th><th>Last order</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.customer)}</td><td>${x.orders}</td><td>${money(x.net)}</td><td>${money(x.aov)}</td><td>${date(x.last)}</td></tr>`).join('')}</tbody></table></div>`}
function svgChart(id,labels,values,type='bar',fmt=v=>String(Math.round(v))){const host=document.getElementById(id);if(!host)return;if(!labels.length){host.innerHTML='<div class="empty">No data for the selected period.</div>';return}const W=720,H=235,p={l:64,r:16,t:14,b:42},iw=W-p.l-p.r,ih=H-p.t-p.b,max=Math.max(...values.map(num),0),top=max>0?max*1.12:1,y=v=>p.t+ih-(num(v)/top)*ih,x=i=>labels.length===1?p.l+iw/2:p.l+(i/(labels.length-1))*iw;let out=`<svg viewBox="0 0 ${W} ${H}">`;for(let i=0;i<=4;i++){const yy=p.t+ih*i/4,val=top*(1-i/4);out+=`<line class="chart-grid" x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}"></line><text class="chart-axis" x="${p.l-7}" y="${yy+4}" text-anchor="end">${esc(fmt(val))}</text>`}if(type==='bar'){const gap=iw/labels.length,bw=Math.max(8,Math.min(52,gap*.62));labels.forEach((lab,i)=>{const cx=p.l+gap*(i+.5),yy=y(values[i]);out+=`<rect class="chart-bar" x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(p.t+ih-yy,1)}" rx="5"><title>${esc(lab)}: ${esc(fmt(values[i]))}</title></rect><text class="chart-axis" x="${cx}" y="${H-15}" text-anchor="middle">${esc(lab)}</text>`})}else{const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');out+=`<polygon class="chart-area" points="${p.l},${p.t+ih} ${pts} ${x(values.length-1)},${p.t+ih}"></polygon><polyline class="chart-line" points="${pts}"></polyline>`;labels.forEach((lab,i)=>out+=`<circle class="chart-dot" cx="${x(i)}" cy="${y(values[i])}" r="4"><title>${esc(lab)}: ${esc(fmt(values[i]))}</title></circle><text class="chart-axis" x="${x(i)}" y="${H-15}" text-anchor="middle">${esc(lab)}</text>`)}host.innerHTML=out+'</svg>'}
function drawCharts(){if(state.view!=='overview')return;const m=monthly(selectedOrders()),currency=selectedOrders().find(r=>r.currency)?.currency||'USD';svgChart('salesChart',m.map(x=>x.label),m.map(x=>x.net),'line',v=>money(v,currency));svgChart('ordersChart',m.map(x=>x.label),m.map(x=>x.orders),'bar',v=>String(Math.round(v)))}
function bind(){document.getElementById('search')?.addEventListener('input',e=>{state.text=e.target.value;render()});document.getElementById('year')?.addEventListener('change',e=>{state.year=e.target.value;render()});document.getElementById('month')?.addEventListener('change',e=>{state.month=e.target.value;render()})}
function render(){document.getElementById('tabs').innerHTML=views.map(([id,label])=>`<button class="tab ${state.view===id?'active':''}" data-view="${id}">${label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.text='';render()});document.getElementById('content').innerHTML={overview,orders:ordersView,products:productsView,customers:customersView}[state.view]();bind();drawCharts()}
async function load(){const results=await Promise.all(Object.entries(URLS).map(async([k,u])=>{try{const r=await fetch(`${u}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(r.status);return[k,await r.json()]}catch(e){console.error(`Unable to load ${u}`,e);return[k,[]]}}));results.forEach(([k,v])=>state[k]=Array.isArray(v)?v:[]);const stamps=[...state.orders,...state.subscriptions].map(r=>new Date(r.report_updated_at)).filter(d=>!Number.isNaN(d));document.getElementById('lastUpdated').textContent=stamps.length?`Last updated ${new Date(Math.max(...stamps)).toLocaleString('en-US')}`:'No report data available';render()}
const theme=document.getElementById('themeToggle');function setTheme(v){document.documentElement.dataset.theme=v;theme.textContent=v==='dark'?'Light mode':'Dark mode';localStorage.setItem('smartpay-theme',v)}theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('smartpay-theme')||'light');load();
</script>
</body></html>
