name: Sync Actuals and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Shopify actuals
        env:
          SHOPIFY_CORRO_STORE: ${{ secrets.SHOPIFY_CORRO_STORE }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_STORE: ${{ secrets.SHOPIFY_CAVALI_STORE }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
          SHOPIFY_API_VERSION: "2026-07"
          SHOPIFY_SYNC_START_DATE: "2024-01-01"
        run: node scripts/sync-shopify-actuals.mjs

      - name: Sync Google Sheets and SKUSavvy CSV actuals
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID_CORRO: ${{ secrets.SHEET_ID_CORRO }}
          SHEET_ID_CAVALI: ${{ secrets.SHEET_ID_CAVALI }}
          ADS_SHEET_ID: ${{ secrets.ADS_SHEET_ID }}
        run: node scripts/sync-connected-data.mjs

      - name: Validate model files
        run: |
          node --check assets/js/app.js
          node --check assets/js/dataService.js
          node --check scripts/sync-shopify-actuals.mjs
          node --check scripts/sync-connected-data.mjs
          node tests-model.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
