name: Subscriptions ETL

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      report_year:
        description: "Calendar year to rebuild, for example 2026. Leave empty for the rolling update."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: subscriptions-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Shopify and Smartrr ETL
        env:
          PYTHONUNBUFFERED: "1"
          SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          ORDERS_LOOKBACK_DAYS: ${{ vars.ORDERS_LOOKBACK_DAYS }}
          REPORT_YEAR: ${{ inputs.report_year }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SMARTRR_ACCESS_TOKEN: ${{ secrets.SMARTRR_ACCESS_TOKEN }}
        run: python src/main.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update subscription analytics [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
